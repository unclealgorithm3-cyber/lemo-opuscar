name: Render Mother vs Doctor Reel

on:
  workflow_dispatch:
    inputs:
      fps:
        description: "Frames per second"
        required: true
        default: "24"
        type: choice
        options:
          - "24"
          - "30"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      REEL_DIR: styles/mother-vs-doctor/reel
      VIDEO_FPS: ${{ inputs.fps }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Install Hindi TTS and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "kokoro-onnx==0.6.1" \
            "misaki==0.9.4" \
            "huggingface_hub[hf_xet]" \
            numpy \
            soundfile

      - name: Generate Hindi voices
        run: |
          python "$REEL_DIR/tts_hindi.py" \
            "$REEL_DIR/lines.json" \
            "$REEL_DIR/voices"

      - name: Create original music, sound effects and subtitles
        run: |
          python "$REEL_DIR/mix.py" \
            "$REEL_DIR/lines.json" \
            "$REEL_DIR/voices" \
            "$REEL_DIR/mix.wav" \
            "$REEL_DIR/captions.srt"

      - name: Render vertical animation
        run: |
          mkdir -p "$REEL_DIR/out"

          LEMO_ANGLE=swiftshader node core/render/video.mjs \
            "$REEL_DIR" \
            --size 1080x1920 \
            --fps "$VIDEO_FPS" \
            --workers 2 \
            --out "$REEL_DIR/out/video.mp4"

      - name: Combine video and audio
        run: |
          mkdir -p artifacts

          sh core/render/mux.sh \
            "$REEL_DIR/out/video.mp4" \
            "$REEL_DIR/mix.wav" \
            artifacts/mother-vs-doctor-reel.mp4 \
            "$VIDEO_FPS" 0

          cp "$REEL_DIR/captions.srt" artifacts/captions.srt

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_type,width,height \
            -of default=noprint_wrappers=1 \
            artifacts/mother-vs-doctor-reel.mp4

      - name: Upload finished Reel
        uses: actions/upload-artifact@v4
        with:
          name: mother-vs-doctor-instagram-reel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
