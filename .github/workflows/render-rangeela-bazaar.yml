name: Render Rangeela Bazaar Part 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      REEL_DIR: styles/rangeela-bazaar/reel
      VIDEO_FPS: "30"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Check project files
        run: |
          node --check "$REEL_DIR/actors.js"
          node --check "$REEL_DIR/set.js"
          node --check "$REEL_DIR/story.js"
          node --check "$REEL_DIR/main.js"
          python -m json.tool "$REEL_DIR/lines.json" > /dev/null
          python -m py_compile "$REEL_DIR/tts_hindi.py" "$REEL_DIR/mix.py"

      - name: Install Hindi TTS and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "kokoro-onnx==0.6.1" \
            "misaki==0.9.4" \
            "huggingface_hub[hf_xet]" \
            numpy \
            soundfile

      - name: Generate Hindi voices
        run: |
          python "$REEL_DIR/tts_hindi.py" \
            "$REEL_DIR/lines.json" \
            "$REEL_DIR/voices"

      - name: Create 90-second music, sound effects and subtitles
        run: |
          python "$REEL_DIR/mix.py" \
            "$REEL_DIR/lines.json" \
            "$REEL_DIR/voices" \
            "$REEL_DIR/mix.wav" \
            "$REEL_DIR/captions.srt"

      - name: Render vertical 3D animation
        run: |
          mkdir -p "$REEL_DIR/out"

          LEMO_ANGLE=swiftshader node core/render/video.mjs \
            "$REEL_DIR" \
            --size 1080x1920 \
            --fps "$VIDEO_FPS" \
            --workers 2 \
            --out "$REEL_DIR/out/video.mp4"

      - name: Combine video and audio
        run: |
          mkdir -p artifacts

          sh core/render/mux.sh \
            "$REEL_DIR/out/video.mp4" \
            "$REEL_DIR/mix.wav" \
            artifacts/rangeela-bazaar-part-1.mp4 \
            "$VIDEO_FPS" 0

          cp "$REEL_DIR/captions.srt" artifacts/captions.srt

      - name: Validate finished video
        run: |
          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_type,width,height \
            -of default=noprint_wrappers=1 \
            artifacts/rangeela-bazaar-part-1.mp4

          python - <<'PY'
          import json
          import subprocess

          path = "artifacts/rangeela-bazaar-part-1.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-show_entries", "stream=width,height",
              "-of", "json", path
          ], text=True)
          info = json.loads(raw)
          duration = float(info["format"]["duration"])
          video = next(
              s for s in info["streams"]
              if "width" in s and "height" in s
          )

          assert 89.0 <= duration <= 91.0, (
              f"Unexpected video duration: {duration:.2f}s"
          )
          assert video["width"] == 1080 and video["height"] == 1920, (
              f"Unexpected resolution: {video['width']}x{video['height']}"
          )
          print(f"Verified: {duration:.2f}s, 1080x1920")
          PY

      - name: Upload finished Reel
        uses: actions/upload-artifact@v4
        with:
          name: rangeela-bazaar-part-1
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
