name: Render test video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Prepare Chalkboard fonts
        run: |
          set -eu
          FONT_DIR="styles/chalkboard/demo/fonts"
          mkdir -p "$FONT_DIR"

          EMS="https://gitlab.com/oskay/svg-fonts/-/raw/master/fonts/EMS"

          for font in EMSDelight EMSCasualHand; do
            curl --fail --location --retry 3 --retry-all-errors \
              "$EMS/$font.svg" \
              --output "$FONT_DIR/$font.svg"
            test -s "$FONT_DIR/$font.svg"
            echo "Downloaded $font.svg"
          done

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/LXGWWenKai-Regular.ttf" \
            --output "$FONT_DIR/LXGWWenKai-Regular.ttf"

          test -s "$FONT_DIR/LXGWWenKai-Regular.ttf"

          python -m pip install 'fonttools[woff]'

          python styles/chalkboard/demo/tools/subset.py

          test -s "$FONT_DIR/wenkai-sub.woff2"
          echo "All Chalkboard fonts are ready."

      - name: Render demonstration video
        env:
          LEMO_ANGLE: swiftshader
        run: |
          node core/render/video.mjs styles/chalkboard/demo \
            --size 1920x1080 \
            --fps 24 \
            --workers 2 \
            --out /tmp/lemo-test.mp4

          test -s /tmp/lemo-test.mp4

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v7
        with:
          name: lemo-render-test
          path: /tmp/lemo-test.mp4
          if-no-files-found: error
          retention-days: 7
