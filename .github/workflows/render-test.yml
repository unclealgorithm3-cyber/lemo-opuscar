name: Render test video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Prepare Blueprint fonts
        run: |
          set -eu
          sh styles/blueprint/demo/tools/fonts.sh

          test -s styles/blueprint/demo/fonts/ArchitectsDaughter-Regular.ttf
          test -s styles/blueprint/demo/fonts/B612-Regular.ttf
          test -s styles/blueprint/demo/fonts/B612-Bold.ttf
          test -s styles/blueprint/demo/fonts/B612Mono-Regular.ttf
          test -s styles/blueprint/demo/fonts/Allura-Regular.ttf
          test -s styles/blueprint/demo/lines.json
          test -s styles/blueprint/demo/voices/dur.json

          echo "All Blueprint rendering assets are ready."

      - name: Render Blueprint demonstration
        env:
          LEMO_ANGLE: swiftshader
        run: |
          node core/render/video.mjs styles/blueprint/demo \
            --size 1280x720 \
            --fps 24 \
            --workers 1 \
            --out /tmp/lemo-blueprint-test.mp4

          test -s /tmp/lemo-blueprint-test.mp4
          ls -lh /tmp/lemo-blueprint-test.mp4

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-render-test
          path: /tmp/lemo-blueprint-test.mp4
          if-no-files-found: error
          retention-days: 7
