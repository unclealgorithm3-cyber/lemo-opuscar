name: Render test video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Prepare topic assets
        run: |
          set -eu
          sh styles/mother-vs-doctor/demo/tools/fonts.sh

          echo "Assets for mother-vs-doctor topic are ready."

      - name: Render topic demonstration
        env:
          LEMO_ANGLE: swiftshader
        run: |
          node core/render/video.mjs styles/mother-vs-doctor/demo \
            --size 1280x720 \
            --fps 24 \
            --workers 1 \
            --out /tmp/lemo-mother-vs-doctor-test.mp4

          test -s /tmp/lemo-mother-vs-doctor-test.mp4
          ls -lh /tmp/lemo-mother-vs-doctor-test.mp4

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v7
        with:
          name: mother-vs-doctor-render-test
          path: /tmp/lemo-mother-vs-doctor-test.mp4
          if-no-files-found: error
          retention-days: 7
